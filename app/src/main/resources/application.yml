server:
  port: 8080

spring:
  mvc:
    # A workflow may make two sequential local-model calls: typed assessment,
    # then the governed tool-capable operation. Keep this outer HTTP deadline
    # longer than TramAI's per-attempt deadline.
    async:
      request-timeout: ${KTCONF_HTTP_ASYNC_TIMEOUT:180s}

# tramai.sovereign.*  = governance truth (trust zones, allowed models/providers/tools)
tramai:
  sovereign:
    enabled: true

    allowed-models:
      - local-invoice-model
      - local-assessment-model
      - cloud-invoice-model
      - local-nvidia-invoice-model
      - global-nvidia-invoice-model
      - eu-nvidia-invoice-model

    allowed-providers:
      - local-provider
      - local-nvidia-provider
      - cloud-provider
      - global-nvidia-provider
      - eu-nvidia-provider

    provider-zones:
      local-provider: LOCAL
      local-nvidia-provider: LOCAL
      cloud-provider: GLOBAL_CLOUD
      global-nvidia-provider: GLOBAL_CLOUD
      eu-nvidia-provider: EU_CLOUD

    models:
      local-invoice-model: local-provider
      local-assessment-model: local-provider
      local-nvidia-invoice-model: local-nvidia-provider
      cloud-invoice-model: cloud-provider
      global-nvidia-invoice-model: global-nvidia-provider
      eu-nvidia-invoice-model: eu-nvidia-provider

    allowed-tools:
      - schedule-payment
      - send-approval-email

    allowed-permissions:
      - payment.schedule
      - notification.email.send

# ktconf.providers.*  = deployment configuration ONLY (which real endpoint serves
# each identity). In the deterministic conference run both stay empty and both
# providers are scripted. When configured, the SAME identities become real
# OpenAI-compatible endpoints:
#   LOCAL  = Qwen3.8-27B-UD-Q6_K on the z840, reached over Tailscale
#   CLOUD  = DeepSeek V4 Flash (https://api.deepseek.com)
# Endpoints/keys are operator-supplied via environment; nothing private is
# committed. The governance configuration above does not change.
ktconf:
  providers:
    local:
      # Qwen3.8-27B-UD-Q6_K served by llama.cpp on the z840 over Tailscale.
      # The served model id is the full GGUF path (verified live); override
      # with KTCONF_DEMO_LOCAL_MODEL if the z840's serving setup changes.
      base-url: ${KTCONF_DEMO_LOCAL_BASE_URL:}
      model: ${KTCONF_DEMO_LOCAL_MODEL:/home/fedora-workstation/models/Qwen3.8-27B-UD-Q6_K.gguf}
      api-key: ${KTCONF_DEMO_LOCAL_API_KEY:}
    local-nvidia:
      # Official NVIDIA Nemotron 3 Nano 4B GGUF served by llama-server.
      base-url: ${KTCONF_GTC_LOCAL_NVIDIA_BASE_URL:}
      model: ${KTCONF_GTC_LOCAL_NVIDIA_MODEL:nvidia/NVIDIA-Nemotron-3-Nano-4B-GGUF:Q4_K_M}
      api-key: ${KTCONF_GTC_LOCAL_NVIDIA_API_KEY:}
    cloud:
      # DeepSeek's OpenAI-compatible API.
      base-url: ${KTCONF_DEMO_CLOUD_BASE_URL:https://api.deepseek.com/v1}
      model: ${KTCONF_DEMO_CLOUD_MODEL:deepseek-v4-flash}
      api-key: ${KTCONF_DEMO_CLOUD_API_KEY:}
    global-nvidia:
      base-url: ${KTCONF_GTC_GLOBAL_NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      model: ${KTCONF_GTC_GLOBAL_NVIDIA_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
      api-key: ${KTCONF_GTC_GLOBAL_NVIDIA_API_KEY:}
    eu-nvidia:
      # Nebius eu-west1 / NVIDIA H200 / official NVIDIA NIM endpoint.
      base-url: ${KTCONF_GTC_EU_NVIDIA_BASE_URL:}
      model: ${KTCONF_GTC_EU_NVIDIA_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
      api-key: ${KTCONF_GTC_EU_NVIDIA_API_KEY:}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    dev.tramai: DEBUG
    dev.giona.ktconf: DEBUG
