server:
  port: 8080

tramai:
  sovereign:
    enabled: true

    allowed-models:
      - local-invoice-model
      - cloud-invoice-model

    allowed-providers:
      - local-provider
      - cloud-provider

    provider-zones:
      local-provider: LOCAL
      cloud-provider: GLOBAL_CLOUD

    models:
      local-invoice-model: local-provider
      cloud-invoice-model: cloud-provider

    allowed-tools:
      - schedule-payment

    allowed-permissions:
      - payment.schedule
