name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned TramAI submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preflight (pinned revision + full deterministic suite + stage binary)
        run: ./scripts/preflight

      - name: Deterministic rehearsal (full suite once)
        run: ./scripts/rehearse

      - name: Stress rehearsal (20 consecutive full oracle runs)
        run: ./scripts/stress-rehearse

      - name: Stage smoke (one app on :8080, all stable commands)
        run: |
          ./scripts/stage-up
          ./scripts/demo typed            | grep -q '"selectedModel":"cloud-invoice-model"' 
          ./scripts/demo restricted       | grep -q '"selectedModel":"local-invoice-model"' 
          ./scripts/demo restricted-cloud | grep -q 'classification-routing-blocked'
          ./scripts/demo invalid          | grep -q 'structured-output-rejected'
          ./scripts/demo healthz          | grep -q '"status":"ok"'
          ./scripts/stage-down
