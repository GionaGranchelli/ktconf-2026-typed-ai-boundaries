name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned TramAI submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preflight (pinned revision + full test suite + stage binary)
        run: ./scripts/preflight

      - name: Deterministic rehearsal
        run: ./scripts/rehearse

      - name: Stress rehearsal (20 consecutive full runs)
        run: ./scripts/stress-rehearse 20
